<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How the study ran</title>
  <!-- Drawn with the diagram-design skill (github.com/cathrynlavery/diagram-design, v2.6, commit 795eec4):
       swimlane type, default skin on white paper (Lam, 28 Nov 2026), no dotted background.
       Counts and dates: report5.tex Implementation section and its % src: comments.
       Type sizes are above the skill's doc ramp so that text stays legible at the IEEE text width (7.16 in). -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;   /* default skin on white (Lam's choice) */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Diagram Design</p>
    <h1>How the study ran</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc">
        <title id="pipeline-title">How the study ran</title>
        <desc id="pipeline-desc">Swimlane of the frozen-encoder study by where each step ran: public images are locked and hashed, features are extracted on a Colab GPU and evaluated on a Colab CPU, then post hoc re-extraction and analyses lead to the frozen result files.</desc>
        <defs>
          <marker id="pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- Lane dividers -->
        <line x1="16" y1="48" x2="1024" y2="48" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="16" y1="120" x2="1024" y2="120" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="16" y1="192" x2="1024" y2="192" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="16" y1="264" x2="1024" y2="264" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
        <line x1="16" y1="336" x2="1024" y2="336" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

        <!-- Lane-label column divider and phase divider (locked | post hoc) -->
        <line x1="120" y1="48" x2="120" y2="336" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <line x1="600" y1="16" x2="600" y2="336" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>

        <!-- Phase headers -->
        <text x="360" y="32" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOCKED · 13–14 NOV 2026</text>
        <text x="812" y="32" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">POST HOC · RULE BEFORE NUMBERS</text>

        <!-- Lane labels -->
        <text x="24" y="88" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.12em">RECORDS</text>
        <text x="24" y="160" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.12em">COLAB GPU</text>
        <text x="24" y="232" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.12em">COLAB CPU</text>
        <text x="24" y="304" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.12em">LAPTOP</text>

        <!-- Arrows (drawn before boxes) -->
        <!-- 1. Public images -> Input lock (within Records) -->
        <line x1="336" y1="84" x2="376" y2="84" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#pipeline-arrow)"/>
        <!-- 2. Input lock -> Feature extraction (Records -> GPU) -->
        <line x1="468" y1="108" x2="468" y2="132" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#pipeline-arrow)"/>
        <!-- 3. Feature extraction -> Locked evaluation (GPU -> CPU) -->
        <line x1="468" y1="180" x2="468" y2="204" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#pipeline-arrow)"/>
        <!-- 4. Locked evaluation -> Post hoc analyses (CPU -> Laptop, across the phase divider); attach 1 of 2 on the top edge -->
        <path d="M 560,228 H 696 Q 704,228 704,236 V 276" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#pipeline-arrow)"/>
        <!-- 5. Re-render and re-extract -> Post hoc analyses (GPU -> Laptop); attach 2 of 2 on the top edge -->
        <line x1="776" y1="180" x2="776" y2="276" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#pipeline-arrow)"/>
        <!-- 6. Post hoc analyses -> Frozen files (Laptop -> Records) -->
        <path d="M 848,300 H 920 Q 928,300 928,292 V 108" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#pipeline-arrow)"/>

        <!-- Arrow labels (opaque masks, 6-10 px from their strokes) -->
        <rect x="476" y="186" width="72" height="12" rx="2" fill="#ffffff"/>
        <text x="512" y="196" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">FEATURES</text>

        <rect x="572" y="208" width="112" height="12" rx="2" fill="#ffffff"/>
        <text x="628" y="218" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOCKED RESULTS</text>

        <rect x="784" y="222" width="96" height="12" rx="2" fill="#ffffff"/>
        <text x="832" y="232" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NEW FEATURES</text>

        <rect x="936" y="194" width="52" height="12" rx="2" fill="#ffffff"/>
        <text x="962" y="204" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">FREEZE</text>

        <!-- Nodes -->
        <!-- Records: Public images -->
        <rect x="136" y="60" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <text x="236" y="82" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Public images</text>
        <text x="236" y="99" fill="#4f5d75" font-size="13" font-family="'Geist Mono', monospace" text-anchor="middle">146 rare + 5,781 other</text>

        <!-- Records: Input lock (focal) -->
        <rect x="376" y="60" width="184" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
        <text x="468" y="82" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Input lock</text>
        <text x="468" y="99" fill="#4f5d75" font-size="13" font-family="'Geist Mono', monospace" text-anchor="middle">SHA256 → Zenodo</text>

        <!-- GPU: Feature extraction -->
        <rect x="376" y="132" width="184" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <text x="468" y="154" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Feature extraction</text>
        <text x="468" y="171" fill="#4f5d75" font-size="13" font-family="'Geist Mono', monospace" text-anchor="middle">4 frozen encoders</text>

        <!-- CPU: Locked evaluation -->
        <rect x="376" y="204" width="184" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <text x="468" y="226" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Locked evaluation</text>
        <text x="468" y="243" fill="#4f5d75" font-size="13" font-family="'Geist Mono', monospace" text-anchor="middle">100 paired draws</text>

        <!-- GPU: Re-render and re-extract (post hoc) -->
        <rect x="632" y="132" width="216" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <text x="740" y="154" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Re-render, re-extract</text>
        <text x="740" y="171" fill="#4f5d75" font-size="13" font-family="'Geist Mono', monospace" text-anchor="middle">E1 · E3 · G1</text>

        <!-- Laptop: Post hoc analyses -->
        <rect x="632" y="276" width="216" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <text x="740" y="298" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Post hoc analyses</text>
        <text x="740" y="315" fill="#4f5d75" font-size="13" font-family="'Geist Mono', monospace" text-anchor="middle">P0–P10 · E1–E4</text>

        <!-- Records: Frozen files -->
        <rect x="840" y="60" width="176" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <text x="928" y="82" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Frozen files</text>
        <text x="928" y="99" fill="#4f5d75" font-size="13" font-family="'Geist Mono', monospace" text-anchor="middle">194 files · SHA256</text>
      </svg>
    </div>
  </div>
</body>
</html>
