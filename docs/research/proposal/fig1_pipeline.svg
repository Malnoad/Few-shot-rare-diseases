<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 536" width="880" font-family="Helvetica, Arial, sans-serif" fill="#1b1b1b" role="img"><defs><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f7a7a"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2c5d9e"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c58a12"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8b9099"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b7079"/></marker><marker id="ah-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b23a55"/></marker><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#8b9099" stroke-width="1.4"/></pattern></defs><text x="22" y="24" font-size="9.5" letter-spacing="0.6"><tspan font-weight="bold">01</tspan> DATA</text><text x="222" y="24" font-size="9.5" letter-spacing="0.6"><tspan font-weight="bold">02</tspan> AUGMENTATION · STAGES 1–2</text><text x="472" y="24" font-size="9.5" letter-spacing="0.6"><tspan font-weight="bold">03</tspan> CLASSIFIER · STAGE 3</text><text x="682" y="24" font-size="9.5" letter-spacing="0.6"><tspan font-weight="bold">04</tspan> EVALUATION · STAGE 4</text><path d="M22,190 L12,190 L12,46 L564,46 L564,60" fill="none" stroke="#1f7a7a" stroke-width="1.1" marker-end="url(#ah-teal)"/><path d="M109,60 L109,46" fill="none" stroke="#1f7a7a" stroke-width="1.1"/><text x="330" y="41" font-size="8.6" text-anchor="middle" font-weight="normal" fill="#2f6f6f">real images: all common classes · real rare images in none only</text><path d="M197,84 L222,84" fill="none" stroke="#1f7a7a" stroke-width="1.1" marker-end="url(#ah-teal)"/><path d="M197,108 L209,108 L209,178 L222,178" fill="none" stroke="#1f7a7a" stroke-width="1.1" marker-end="url(#ah-teal)"/><path d="M197,202 L222,202" fill="none" stroke="#1f7a7a" stroke-width="1.1" marker-end="url(#ah-teal)"/><path d="M334,220 L334,260" fill="none" stroke="#1f7a7a" stroke-width="1.1" marker-end="url(#ah-teal)"/><path d="M275,320 L275,360" fill="none" stroke="#c58a12" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#ah-amber)"/><path d="M393,320 L393,360" fill="none" stroke="#1f7a7a" stroke-width="1.1" marker-end="url(#ah-teal)"/><path d="M447,84 L472,84" fill="none" stroke="#1f7a7a" stroke-width="1.1" marker-end="url(#ah-teal)"/><path d="M447,390 L459,390 L459,104 L472,104" fill="none" stroke="#1f7a7a" stroke-width="1.1" marker-end="url(#ah-teal)"/><path d="M564,120 L564,160" fill="none" stroke="#2c5d9e" stroke-width="1.1" marker-end="url(#ah-blue)"/><path d="M564,220 L564,260" fill="none" stroke="#2c5d9e" stroke-width="1.1" marker-end="url(#ah-blue)"/><path d="M657,290 L669,290 L669,200 L682,200" fill="none" stroke="#2c5d9e" stroke-width="1.1" marker-end="url(#ah-blue)"/><path d="M772,120 L772,160" fill="none" stroke="#8b9099" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#ah-gray)"/><text x="778" y="143" font-size="7.8" text-anchor="start" font-weight="normal" fill="#777">scored against</text><path d="M772,220 L772,260" fill="none" stroke="#8b9099" stroke-width="1.1" marker-end="url(#ah-gray)"/><path d="M275,420 L275,450" fill="none" stroke="#c58a12" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#ah-amber)"/><rect x="22" y="60" width="175" height="60" rx="3" fill="#e7f3f2" stroke="#1f7a7a" stroke-width="1.1"/><text x="109.5" y="81.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Rare-disease OCT</text><text x="109.5" y="93.69999999999999" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">CSC · MH · MacTel · Stargardt · RP</text><text x="109.5" y="106.3" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">19–27 train · 4–5 test per class</text><rect x="22" y="160" width="175" height="60" rx="3" fill="#e7f3f2" stroke="#1f7a7a" stroke-width="1.1"/><text x="109.5" y="181.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Kermany OCT2017</text><text x="109.5" y="193.7" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">NORMAL · CNV · DME · DRUSEN</text><text x="109.5" y="206.29999999999998" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">73,958 fitting · 1,000 test</text><rect x="222" y="60" width="225" height="60" rx="3" fill="#e7f3f2" stroke="#1f7a7a" stroke-width="1.1"/><text x="334.5" y="81.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Stage 1 · basic augmentation</text><text x="334.5" y="93.69999999999999" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">flips · shift · rotation · zoom</text><text x="334.5" y="106.3" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">brightness · elastic · 2,000 per class</text><rect x="222" y="160" width="225" height="60" rx="3" fill="#e7f3f2" stroke="#1f7a7a" stroke-width="1.1"/><text x="334.5" y="181.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Stage 2 · CycleGAN per disease</text><text x="334.5" y="193.7" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">NORMAL → disease, 100 epochs</text><text x="334.5" y="206.29999999999998" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">4,000 generated per disease</text><rect x="222" y="260" width="225" height="60" rx="3" fill="#e7f3f2" stroke="#1f7a7a" stroke-width="1.1"/><text x="334.5" y="281.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Automatic QC gate</text><text x="334.5" y="293.70000000000005" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">k = 3 cosine kNN: d_rare &lt; d_normal</text><text x="334.5" y="306.3" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">keep ≤ 3,000 nearest real disease</text><rect x="222" y="360" width="107" height="60" rx="3" fill="#fdf6e6" stroke="#c58a12" stroke-width="1.1" stroke-dasharray="5 3"/><text x="275.5" y="381.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Top-up v2 (C5)</text><text x="275.5" y="393.70000000000005" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">3,000 per class</text><text x="275.5" y="406.3" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">C2 · C3 only</text><rect x="340" y="360" width="107" height="60" rx="3" fill="#e7f3f2" stroke="#1f7a7a" stroke-width="1.1"/><text x="393.5" y="381.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Accepted v1</text><text x="393.5" y="393.70000000000005" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">832–3,000 per class</text><text x="393.5" y="406.3" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">C1 · runs of record</text><rect x="472" y="60" width="185" height="60" rx="3" fill="#e9eff8" stroke="#2c5d9e" stroke-width="1.1"/><text x="564.5" y="81.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Training pool by variant</text><text x="564.5" y="93.69999999999999" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">common: all fitting images</text><text x="564.5" y="106.3" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">rare: none | basic | gan</text><rect x="472" y="160" width="185" height="60" rx="3" fill="#e9eff8" stroke="#2c5d9e" stroke-width="1.1"/><text x="564.5" y="181.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Inception-v3 (ImageNet)</text><text x="564.5" y="193.7" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">frozen · avg-pool 2,048-d</text><text x="564.5" y="206.29999999999998" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">features cached once</text><rect x="472" y="260" width="185" height="60" rx="3" fill="#e9eff8" stroke="#2c5d9e" stroke-width="1.8"/><text x="564.5" y="281.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Softmax head</text><text x="564.5" y="293.70000000000005" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">9-way dense · Adam 1e-3 · batch 10</text><text x="564.5" y="306.3" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">the only trained weights</text><rect x="682" y="60" width="180" height="60" rx="3" fill="#ffffff" stroke="#8b9099" stroke-width="1.1" stroke-dasharray="5 3"/><text x="772.0" y="81.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Test set (committed)</text><text x="772.0" y="93.69999999999999" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">1,000 Kermany + 22 rare</text><text x="772.0" y="106.3" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">evaluation only</text><rect x="682" y="160" width="180" height="60" rx="3" fill="#f6f6f4" stroke="#6b7079" stroke-width="1.1"/><text x="772.0" y="181.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Metrics</text><text x="772.0" y="193.7" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">accuracy · κ · MCC · recall</text><text x="772.0" y="206.29999999999998" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">RCI kept out of claims</text><rect x="682" y="260" width="180" height="60" rx="3" fill="#f6f6f4" stroke="#6b7079" stroke-width="1.1"/><text x="772.0" y="281.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Uncertainty</text><text x="772.0" y="293.70000000000005" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">patient-cluster bootstrap (655)</text><text x="772.0" y="306.3" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">paired by training seed</text><rect x="682" y="360" width="180" height="60" rx="3" fill="#f6f6f4" stroke="#6b7079" stroke-width="1.1"/><text x="772.0" y="381.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Baselines, same features</text><text x="772.0" y="393.70000000000005" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">kNN K=3 86.40%</text><text x="772.0" y="406.3" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">class mean 68.98%</text><rect x="22" y="450" width="175" height="46" rx="3" fill="#f6f6f4" stroke="#6b7079" stroke-width="1.1"/><text x="109.5" y="470.3" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Manifest (committed)</text><text x="109.5" y="482.90000000000003" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">fixes every split · never re-sampled</text><rect x="222" y="450" width="435" height="46" rx="3" fill="#fdf6e6" stroke="#c58a12" stroke-width="1.1" stroke-dasharray="5 3"/><text x="439.5" y="470.3" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Pending Colab experiments C1–C3</text><text x="439.5" y="482.90000000000003" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">C1: accepted v1 · C2 GAN amount and C3 common caps: v2 · outputs isolated on Drive</text><rect x="682" y="450" width="180" height="46" rx="3" fill="#fbecef" stroke="#b23a55" stroke-width="1.1"/><text x="772.0" y="470.3" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Identified risks ①–③</text><text x="772.0" y="482.90000000000003" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">Table 3</text><circle cx="440" cy="266" r="7.5" fill="#b23a55"/><text x="440" y="269.3" font-size="9" text-anchor="middle" font-weight="bold" fill="#fff">1</text><circle cx="650" cy="166" r="7.5" fill="#b23a55"/><text x="650" y="169.3" font-size="9" text-anchor="middle" font-weight="bold" fill="#fff">1</text><circle cx="190" cy="66" r="7.5" fill="#b23a55"/><text x="190" y="69.3" font-size="9" text-anchor="middle" font-weight="bold" fill="#fff">2</text><circle cx="855" cy="66" r="7.5" fill="#b23a55"/><text x="855" y="69.3" font-size="9" text-anchor="middle" font-weight="bold" fill="#fff">2</text><circle cx="650" cy="66" r="7.5" fill="#b23a55"/><text x="650" y="69.3" font-size="9" text-anchor="middle" font-weight="bold" fill="#fff">3</text><rect x="110" y="516" width="14" height="9" fill="#e7f3f2" stroke="#1f7a7a"/><text x="129" y="524" font-size="8.8" text-anchor="start" font-weight="normal" fill="#444">images (real and generated)</text><rect x="262.9" y="516" width="14" height="9" fill="#e9eff8" stroke="#2c5d9e"/><text x="281.9" y="524" font-size="8.8" text-anchor="start" font-weight="normal" fill="#444">classifier</text><rect x="335.9" y="516" width="14" height="9" fill="#ffffff" stroke="#8b9099" stroke-dasharray="4 2"/><text x="354.9" y="524" font-size="8.8" text-anchor="start" font-weight="normal" fill="#444">evaluation only</text><rect x="432.4" y="516" width="14" height="9" fill="#fdf6e6" stroke="#c58a12" stroke-dasharray="4 2"/><text x="451.4" y="524" font-size="8.8" text-anchor="start" font-weight="normal" fill="#444">pending / C2–C3 only</text><rect x="552.4" y="516" width="14" height="9" fill="#fbecef" stroke="#b23a55"/><text x="571.4" y="524" font-size="8.8" text-anchor="start" font-weight="normal" fill="#444">risk</text></svg>