-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">A3 − A4: QC selection</text><text x="465.0" y="309.90000000000003" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">tests risk ① (shared feature space)</text><rect x="640" y="32" width="220" height="84" rx="3" fill="#e9eff8" stroke="#2c5d9e" stroke-width="1.8"/><text x="750.0" y="65.1" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Primary: overall test accuracy</text><text x="750.0" y="77.69999999999999" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">1,022 tests · paired by seed</text><text x="750.0" y="90.3" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">same five-zone rule as C1</text><rect x="640" y="132" width="220" height="84" rx="3" fill="#e7f3f2" stroke="#1f7a7a" stroke-width="1.1"/><text x="750.0" y="158.9" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Rare-conditional accuracy (proposed)</text><text x="750.0" y="171.5" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">argmax over the 5 rare classes</text><text x="750.0" y="184.1" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">on the 22 rare tests · training-free</text><text x="750.0" y="196.7" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">removes the rare-vs-common cue ②</text><rect x="640" y="232" width="220" height="84" rx="3" fill="#f6f6f4" stroke="#6b7079" stroke-width="1.1"/><text x="750.0" y="258.9" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">Controls</text><text x="750.0" y="271.5" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">common macro recall</text><text x="750.0" y="284.09999999999997" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">rare correct count (of 22)</text><text x="750.0" y="296.7" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#333