<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" font-family="Helvetica, Arial, sans-serif" fill="#1b1b1b" role="img"><defs><marker id="ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1f7a7a"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2c5d9e"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c58a12"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8b9099"/></marker><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b7079"/></marker><marker id="ah-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b23a55"/></marker><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#8b9099" stroke-width="1.4"/></pattern></defs><text x="20" y="18" font-size="9.5" letter-spacing="0.6"><tspan font-weight="bold">C1</tspan> LOCKED 27 OCT 2026 · NO C1 OUTCOMES EXIST</text><rect x="20" y="30" width="155" height="80" rx="3" fill="#e9eff8" stroke="#2c5d9e" stroke-width="1.1"/><text x="97.5" y="48.7" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">① First stage</text><text x="97.5" y="61.300000000000004" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">seeds 1–20 × none/basic/gan</text><text x="97.5" y="73.9" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">fixed250 final (primary)</text><text x="97.5" y="86.5" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">+ es20 (sensitivity)</text><text x="97.5" y="99.1" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">120 heads</text><path d="M175,70 L191,70" fill="none" stroke="#2c5d9e" stroke-width="1.1" marker-end="url(#ah-blue)"/><rect x="191" y="30" width="155" height="80" rx="3" fill="#e7f3f2" stroke="#1f7a7a" stroke-width="1.1"/><text x="268.5" y="48.7" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">② Lock SD once</text><text x="268.5" y="61.300000000000004" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">sample SD of the 20</text><text x="268.5" y="73.9" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">fixed250 gan − basic</text><text x="268.5" y="86.5" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">differences (ddof 1)</text><text x="268.5" y="99.1" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">no outcome peeking</text><path d="M346,70 L362,70" fill="none" stroke="#2c5d9e" stroke-width="1.1" marker-end="url(#ah-blue)"/><rect x="362" y="30" width="155" height="80" rx="3" fill="#e7f3f2" stroke="#1f7a7a" stroke-width="1.1"/><text x="439.5" y="48.7" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">③ Target N</text><text x="439.5" y="61.300000000000004" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">smallest n with paired-t</text><text x="439.5" y="73.9" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">power ≥ .80 at 1 pp, α .05</text><text x="439.5" y="86.5" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">N = max(63, n)</text><text x="439.5" y="99.1" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">cap 243 pairs</text><path d="M517,70 L533,70" fill="none" stroke="#2c5d9e" stroke-width="1.1" marker-end="url(#ah-blue)"/><rect x="533" y="30" width="155" height="80" rx="3" fill="#fdf6e6" stroke="#c58a12" stroke-width="1.1" stroke-dasharray="5 3"/><text x="610.5" y="48.7" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">④ Top-up</text><text x="610.5" y="61.300000000000004" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">save topup.json first</text><text x="610.5" y="73.9" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">fixed250 seeds 21..N</text><text x="610.5" y="86.5" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">no early stopping</text><text x="610.5" y="99.1" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">failed head: same seed</text><path d="M688,70 L704,70" fill="none" stroke="#2c5d9e" stroke-width="1.1" marker-end="url(#ah-blue)"/><rect x="704" y="30" width="155" height="80" rx="3" fill="#e9eff8" stroke="#2c5d9e" stroke-width="1.1"/><text x="781.5" y="48.7" font-size="10" text-anchor="middle" font-weight="bold" fill="#1b1b1b">⑤ Read once</text><text x="781.5" y="61.300000000000004" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">paired-t 95% CI [L, U]</text><text x="781.5" y="73.9" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">of gan − basic</text><text x="781.5" y="86.5" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">Wilcoxon: sensitivity</text><text x="781.5" y="99.1" font-size="8.9" text-anchor="middle" font-weight="normal" fill="#33373d">five-zone rule below</text><text x="20" y="136" font-size="9" text-anchor="start" font-weight="normal" fill="#1b1b1b">Expected 95% half-width of gan − basic if the SD stays at the 5-seed value (2.77 pp):</text><rect x="20" y="144" width="86.0" height="11" fill="#e7f3f2" stroke="#1f7a7a"/><text x="110.9774991438005" y="153" font-size="8.6" text-anchor="start" font-weight="normal" fill="#1b1b1b">n = 5: ±3.44 pp</text><rect x="210" y="144" width="32.4" height="11" fill="#e7f3f2" stroke="#1f7a7a"/><text x="247.40708298337208" y="153" font-size="8.6" text-anchor="start" font-weight="normal" fill="#1b1b1b">n = 20: ±1.30 pp</text><rect x="400" y="144" width="17.4" height="11" fill="#e7f3f2" stroke="#1f7a7a"/><text x="422.43881822239445" y="153" font-size="8.6" text-anchor="start" font-weight="normal" fill="#1b1b1b">n = 63: ±0.70 pp</text><line x1="70" y1="310" x2="520" y2="310" stroke="#555" stroke-width="0.8"/><line x1="70.0" y1="310" x2="70.0" y2="314" stroke="#555" stroke-width="0.8"/><text x="70.0" y="324" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#444">-3</text><line x1="145.0" y1="310" x2="145.0" y2="314" stroke="#555" stroke-width="0.8"/><text x="145.0" y="324" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#444">-2</text><line x1="220.0" y1="310" x2="220.0" y2="314" stroke="#555" stroke-width="0.8"/><text x="220.0" y="324" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#444">-1</text><line x1="295.0" y1="310" x2="295.0" y2="314" stroke="#555" stroke-width="0.8"/><text x="295.0" y="324" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#444">+0</text><line x1="370.0" y1="310" x2="370.0" y2="314" stroke="#555" stroke-width="0.8"/><text x="370.0" y="324" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#444">+1</text><line x1="445.0" y1="310" x2="445.0" y2="314" stroke="#555" stroke-width="0.8"/><text x="445.0" y="324" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#444">+2</text><line x1="520.0" y1="310" x2="520.0" y2="314" stroke="#555" stroke-width="0.8"/><text x="520.0" y="324" font-size="8.5" text-anchor="middle" font-weight="normal" fill="#444">+3</text><text x="295.0" y="338" font-size="9" text-anchor="middle" font-weight="normal" fill="#333">gan − basic, mean test accuracy (pp)</text><line x1="295.0" y1="160" x2="295.0" y2="310" stroke="#555" stroke-width="0.9"/><line x1="370.0" y1="160" x2="370.0" y2="310" stroke="#1f7a7a" stroke-dasharray="4 3"/><text x="373.0" y="168" font-size="8.4" text-anchor="start" font-weight="normal" fill="#1f7a7a">1 pp</text><line x1="385.00000000000006" y1="182" x2="475.0" y2="182" stroke="#1f7a7a" stroke-width="2.4"/><line x1="385.00000000000006" y1="177" x2="385.00000000000006" y2="187" stroke="#1f7a7a" stroke-width="1.4"/><line x1="475.0" y1="177" x2="475.0" y2="187" stroke="#1f7a7a" stroke-width="1.4"/><text x="540" y="185" font-size="9" text-anchor="start" font-weight="bold" fill="#1f7a7a">L ≥ 1: supports a gain of at least 1 pp</text><line x1="317.5" y1="207" x2="422.5" y2="207" stroke="#2c5d9e" stroke-width="2.4"/><line x1="317.5" y1="202" x2="317.5" y2="212" stroke="#2c5d9e" stroke-width="1.4"/><line x1="422.5" y1="202" x2="422.5" y2="212" stroke="#2c5d9e" stroke-width="1.4"/><text x="540" y="210" font-size="9" text-anchor="start" font-weight="normal" fill="#2c5d9e">0 &lt; L &lt; 1: positive gain; 1 pp not established</text><line x1="265.0" y1="232" x2="355.0" y2="232" stroke="#555" stroke-width="2.4"/><line x1="265.0" y1="227" x2="265.0" y2="237" stroke="#555" stroke-width="1.4"/><line x1="355.0" y1="227" x2="355.0" y2="237" stroke="#555" stroke-width="1.4"/><text x="540" y="235" font-size="9" text-anchor="start" font-weight="normal" fill="#555">U &lt; 1 (L ≤ 0): excludes a 1 pp gain; no equivalence claim</text><line x1="152.5" y1="257" x2="257.5" y2="257" stroke="#b23a55" stroke-width="2.4"/><line x1="152.5" y1="252" x2="152.5" y2="262" stroke="#b23a55" stroke-width="1.4"/><line x1="257.5" y1="252" x2="257.5" y2="262" stroke="#b23a55" stroke-width="1.4"/><text x="540" y="260" font-size="9" text-anchor="start" font-weight="normal" fill="#b23a55">U &lt; 0: interval favours basic</text><line x1="249.99999999999997" y1="282" x2="415.0" y2="282" stroke="#8b9099" stroke-width="2.4"/><line x1="249.99999999999997" y1="277" x2="249.99999999999997" y2="287" stroke="#8b9099" stroke-width="1.4"/><line x1="415.0" y1="277" x2="415.0" y2="287" stroke="#8b9099" stroke-width="1.4"/><text x="540" y="285" font-size="9" text-anchor="start" font-weight="normal" fill="#8b9099">otherwise: inconclusive against 0 and 1 pp</text><text x="295" y="352" font-size="8.4" text-anchor="middle" font-weight="normal" fill="#555" font-style="italic">Intervals are illustrative shapes for each rule, not results.</text></svg>